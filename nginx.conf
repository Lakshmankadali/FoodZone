server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for Docker, load balancers and monitoring
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite gives these files new hashed names on every build, so browsers can cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React routing: if the file doesn't exist (e.g. /veg), serve index.html and let React show the page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
